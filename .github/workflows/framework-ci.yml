name: OliverCode Framework CI

on:
  push:
    branches: [staging]
  pull_request:
    branches: [main]

# Least privilege: these jobs only read the repo and run checks. Without an explicit
# grant GITHUB_TOKEN inherits the repository default, which on many repos is
# read-write -- enough for a compromised step to push code.
permissions:
  contents: read

jobs:
  framework-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Health check
        run: python3 scripts/olivercode health

      # validate.sh covers the pre-commit gates, gate incident records, reference
      # integrity, bloat, code quality and the smoke tests.
      - name: Validate gates over the whole tree
        run: bash scripts/validate.sh --tree

      # The property this repo exists to have: a stranger can clone it and it
      # works with no configuration. It broke silently more than once, so it is
      # a gating step, not a nicety.
      - name: Install rehearsal (clean checkout, no config, virgin HOME)
        run: bash scripts/qa/rehearse-install.sh

