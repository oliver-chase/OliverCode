name: Dependency Review

# Manual only: GitHub Actions is paused for managed repos (docs/GATES.md). The pull request
# review job needs a pull request event, so it stays dormant until you add that trigger.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, AGPL-1.0, AGPL-3.0

  dependency-health:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Look for package.json
        id: pkg
        run: |
          if [ -f package.json ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No package.json in this repo, so the npm steps are skipped."
          fi

      - name: Setup Node
        if: steps.pkg.outputs.found == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        if: steps.pkg.outputs.found == 'true'
        run: npm ci

      - name: Audit Production Dependencies
        if: steps.pkg.outputs.found == 'true'
        run: npm audit --omit=dev --audit-level=high

      - name: Report Outdated Dependencies
        if: steps.pkg.outputs.found == 'true'
        run: npm outdated || true
